<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Smart Job Portal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 40px 35px;

            border-radius: 16px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

            border: 1px solid #eee;
        }

        .logo {
            text-align: center;

            font-size: 28px;
            font-weight: bold;

            color: #4f46e5;

            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;

            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        .error {
            background: #fff0f0;

            color: #dc3545;

            padding: 12px;

            border-radius: 8px;

            margin-bottom: 20px;

            text-align: center;

            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

            outline: none;

            transition: 0.3s;
        }

        input:focus {
            border-color: #4f46e5;

            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .login-btn {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        .login-btn:hover {
            background: #4338ca;

            transform: translateY(-1px);
        }

        .register-link {
            text-align: center;

            margin-top: 24px;

            color: #666;

            font-size: 14px;
        }

        .register-link a {
            color: #4f46e5;

            text-decoration: none;

            font-weight: bold;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .back-home {
            text-align: center;

            margin-top: 15px;

            font-size: 13px;
        }

        .back-home a {
            color: #777;

            text-decoration: none;
        }

        .back-home a:hover {
            color: #4f46e5;
        }

        @media (max-width: 480px) {

            .login-container {
                padding: 30px 22px;
            }

            .logo {
                font-size: 24px;
            }
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="logo">
        Smart Job Portal
    </div>

    <p class="subtitle">
        Login to continue your job journey
    </p>

    {% if error %}

        <div class="error">
            {{ error }}
        </div>

    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                required>

        </div>

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required>

        </div>

        <button
            type="submit"
            class="login-btn">

            Login

        </button>

    </form>

    <div class="register-link">

        Don't have an account?

        <a href="{% url 'register' %}">
            Create Account
        </a>

    </div>

    <div class="back-home">

        <a href="{% url 'home' %}">
            ← Back to Home
        </a>

    </div>

</div>

</body>

</html>
