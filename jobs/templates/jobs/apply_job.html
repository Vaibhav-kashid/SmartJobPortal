<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apply for {{ job.title }} | Smart Job Portal</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fb;
            color: #333;
            min-height: 100vh;
        }

        /* Navbar */

        .navbar {
            background: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.08);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            text-decoration: none;
            color: #555;
            padding: 10px 15px;
            border-radius: 7px;
            transition: 0.3s;
            font-weight: 500;
        }

        .nav-links a:hover {
            background: #667eea;
            color: white;
        }

        .nav-links .logout:hover {
            background: #dc3545;
        }

        /* Container */

        .container {
            width: 92%;
            max-width: 650px;
            margin: 45px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 5px 22px rgba(0, 0, 0, 0.07);
            border-top: 5px solid #667eea;
        }

        /* Header */

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
            color: #222;
            margin-bottom: 10px;
        }

        .job-title {
            color: #667eea;
            font-size: 17px;
            font-weight: bold;
        }

        .company {
            color: #777;
            margin-top: 5px;
            font-size: 14px;
        }

        /* Form */

        form p {
            margin-bottom: 18px;
        }

        form label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        form input,
        form textarea,
        form select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #d8dbe2;
            border-radius: 8px;
            font-size: 15px;
            font-family: Arial, Helvetica, sans-serif;
            background: white;
            transition: 0.3s;
        }

        form input:focus,
        form textarea:focus,
        form select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.10);
        }

        form textarea {
            min-height: 110px;
            resize: vertical;
        }

        form input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        form ul {
            margin-top: 6px;
            padding-left: 20px;
            color: #777;
            font-size: 13px;
        }

        .helptext {
            display: block;
            margin-top: 5px;
            color: #888;
            font-size: 13px;
        }

        /* Errors */

        .error {
            background: #f8d7da;
            color: #842029;
            border: 1px solid #f5c2c7;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .errorlist {
            color: #dc3545;
            margin: 5px 0 0;
            padding-left: 20px;
            font-size: 13px;
        }

        /* Submit */

        button {
            width: 100%;
            margin-top: 10px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #5568d8;
            transform: translateY(-2px);
        }

        /* Back */

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #667eea;
            font-weight: bold;
        }

        .back:hover {
            text-decoration: underline;
        }

        /* Mobile */

        @media (max-width: 600px) {

            .navbar {
                padding: 16px 20px;
                flex-direction: column;
                gap: 12px;
            }

            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
            }

            .container {
                width: 92%;
                margin: 30px auto;
            }

            .card {
                padding: 25px 20px;
            }

            .header h1 {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>


    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            Smart Job Portal
        </div>

        <div class="nav-links">

            <a href="{% url 'home' %}">
                Home
            </a>

            <a href="{% url 'job_list' %}">
                Jobs
            </a>

            <a href="{% url 'logout' %}" class="logout">
                Logout
            </a>

        </div>

    </nav>


    <!-- Application Form -->

    <div class="container">

        <div class="card">


            <div class="header">

                <h1>
                    Apply for Job
                </h1>

                <div class="job-title">
                    {{ job.title }}
                </div>

                <div class="company">
                    {{ job.company_name }}
                </div>

            </div>


            <form method="POST" enctype="multipart/form-data">

                {% csrf_token %}

                {% if form.errors %}

                    <div class="error">
                        Please correct the errors below and try again.
                    </div>

                {% endif %}


                {{ form.as_p }}


                <button type="submit">
                    Submit Application
                </button>

            </form>


            <a
                class="back"
                href="{% url 'job_details' job.id %}">

                ← Back to Job Details

            </a>


        </div>

    </div>


</body>

</html>
